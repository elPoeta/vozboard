[project]
name = "stt"
version = "0.1.0"
description = "Vozboard local con GPU (faster-whisper), CLI y web"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.3",
    "sounddevice>=0.4.7",
    "scipy>=1.13.0",
    "numpy>=1.26.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
stt = "stt.cli:main"
stt-web = "stt.web:main"
stt-daemon = "stt.daemon:main"

[project.optional-dependencies]
# CTranslate2 (usado por faster-whisper) viene compilado contra las
# librerías runtime de CUDA 12, sin importar la versión del CUDA Toolkit
# que tengas instalada a nivel sistema. Si te aparece un error de
# "libcublas.so.12 is not found" o similar con libcudnn, instalá este
# extra: `uv sync --extra cuda`.
cuda = [
    "nvidia-cublas-cu12>=12.9; platform_system == 'Linux'",
    "nvidia-cudnn-cu12>=9.24; platform_system == 'Linux'",
    "nvidia-cuda-runtime-cu12>=12.9; platform_system == 'Linux'",
]

# Modo standalone: ícono de bandeja + atajo global (ver README, sección
# "Modo standalone"). También necesitás el paquete de sistema `ydotool`
# (y opcionalmente `wl-clipboard`), que uv no puede instalar.
daemon = [
    "pyside6>=6.7",
    "evdev>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stt"]
